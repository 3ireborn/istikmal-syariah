<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesin Builder LP - Istikmal Syariah</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; }
        .box { background: white; max-width: 700px; margin: auto; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { color: #065f46; text-align: center; }
        label { font-weight: bold; margin-top: 15px; display: block; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #059669; color: white; padding: 15px 20px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 20px; cursor: pointer; }
        button:hover { background: #047857; }
        textarea { width: 100%; height: 300px; margin-top: 20px; padding: 10px; font-family: monospace; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚀 Mesin Builder LP Mitra 3iReborn</h2>
    <p style="text-align:center; color:#555;">Isi data mitra di bawah ini untuk men-generate script HTML Landing Page otomatis.</p>
    
    <label>Nama Mitra (Cth: Coach Helmy)</label>
    <input type="text" id="namaMitra" placeholder="Masukkan Nama Mitra...">

    <label>Nomor WhatsApp (Cth: 6281234567890)</label>
    <input type="text" id="waMitra" placeholder="Mulai dengan 62...">

    <label>Nama File Foto Profil (Cth: foto-helmy.jpg)</label>
    <input type="text" id="fotoMitra" placeholder="Nama file foto yang akan diupload...">

    <button onclick="generateLP()">TAMPILKAN SCRIPT HTML</button>

    <label>Kopi Script di Bawah Ini:</label>
    <textarea id="outputHTML" readonly placeholder="Script HTML akan muncul di sini..."></textarea>
</div>

<script>
    function generateLP() {
        let nama = document.getElementById('namaMitra').value;
        let wa = document.getElementById('waMitra').value;
        let foto = document.getElementById('fotoMitra').value;

        if(!nama || !wa || !foto) {
            alert("Harap isi semua data, Komandan!");
            return;
        }

        // Template dasar HTML (Bisa disesuaikan dengan script utuh di atas)
        let template = `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Istikmal Syariah bersama ${nama}</title>
    <!-- CSS Omitted for brevity in this preview, paste full CSS here -->
</head>
<body>
    <div class="profile-section">
        <img src="${foto}" alt="${nama}">
        <h2>${nama}</h2>
        <div class="profile-role">Leader Entrepreneur 3iReborn</div>
    </div>
    
    <div id="cta">
        <a href="https://wa.me/${wa}?text=Halo%20${nama},%20saya%20mau%20konsultasi%20program%20Ikhtiar%20Baitullah." class="btn-wa pulse">
            Hubungi Saya di WhatsApp
        </a>
    </div>
    <div class="footer-copyright">Konsultan Eksekutif: <strong>${nama}</strong></div>
</body>
</html>`;

        document.getElementById('outputHTML').value = template;
    }
</script>

</body>
</html>
