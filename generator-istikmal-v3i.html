<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Referral Istikmal Syariah V3.i</title>

<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }
body { margin:0; background: linear-gradient(180deg, #063d2b, #0a3d2b); color:white; }
.container { max-width:800px; margin:auto; padding:20px; }
.logo { text-align:center; margin-bottom:20px; }
.logo img { width:180px; }
h1 { text-align:center; color:#d8c26a; margin-bottom:5px; font-size:28px; }
.subtitle { text-align:center; line-height:1.7; margin-bottom:30px; font-size:16px; }
.card { background:#0b513b; padding:28px; border-radius:25px; margin-bottom:25px; border:1px solid #d8c26a33; }
label { display:block; margin:18px 0 8px; font-weight:bold; color:#d8c26a; }
input, select { width:100%; padding:14px; border:none; border-radius:12px; font-size:16px; background:#02291d; color:white; }
button { width:100%; padding:18px; border:none; border-radius:50px; margin-top:15px; font-size:19px; font-weight:bold; background:linear-gradient(90deg, #d8c26a, #f0d38a); color:#063d2b; cursor:pointer; box-shadow: 0 6px 12px rgba(216, 194, 106, 0.3); }
.result { background:#02291d; padding:16px; border-radius:15px; margin-top:12px; word-break:break-all; font-size:14.5px; line-height:1.5; }
</style>
</head>
<body>

<div class="container">
  <div class="logo"><img src="assets/logo-istikmal.png"></div>
  <h1>🕋 Generator Referral Istikmal Syariah V3.i</h1>
  <div class="subtitle">Buat Link Referral Profesional Dalam Hitungan Detik</div>

  <div class="card">
    <label>Nama Leader</label>
    <input type="text" id="nama" placeholder="Contoh: PakD Sugiarto">

    <label>Nomor WhatsApp</label>
    <input type="text" id="wa" placeholder="628xxxxxxxxxx">

    <label>Title / Jabatan</label>
    <select id="title">
      <option value="Mitra 3IReborn">Mitra 3IReborn</option>
      <option value="Team Entrepreneur">Team Entrepreneur</option>
      <option value="Leader Entrepreneur">Leader Entrepreneur</option>
      <option value="Bronze Entrepreneur">Bronze Entrepreneur</option>
      <option value="Silver Entrepreneur">Silver Entrepreneur</option>
      <option value="Gold Entrepreneur">Gold Entrepreneur</option>
      <option value="Diamond Executive">Diamond Executive</option>
      <option value="Royal Executive">Royal Executive</option>
      <option value="King Executive">King Executive</option>
      <option value="Queen 3IReborn">Queen 3IReborn</option>
    </select>

    <button onclick="generateReferral()">🚀 Generate Referral</button>
  </div>

  <div class="card">
    <h3>🔗 Link Landing Page</h3>
    <div id="lpLink" class="result">Belum dibuat</div>
    <button onclick="copyLP()">📋 Copy Link LP</button>
    <button onclick="previewLP()">👁 Preview LP</button>
  </div>

  <div class="card">
    <h3>📱 Link WhatsApp</h3>
    <div id="waLink" class="result">Belum dibuat</div>
    <button onclick="copyWA()">📋 Copy Link WA</button>
    <button onclick="testWA()">📱 Test WhatsApp</button>
  </div>

  <div class="card">
    <h3>📱 QR Code Referral</h3>
    <div id="qrcode" style="text-align:center; margin:20px auto; padding:20px; background:white; border-radius:15px; width:fit-content;"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
let landingPage = "";
let whatsappLink = "";

function generateReferral(){
  const nama = document.getElementById("nama").value.trim();
  const wa = document.getElementById("wa").value.trim();
  const title = document.getElementById("title").value;

  if(!nama || !wa){
    alert("❌ Mohon lengkapi Nama Leader dan Nomor WhatsApp!");
    return;
  }

  landingPage = `https://3ireborn.github.io/istikmal-syariah/?nama=${encodeURIComponent(nama)}&wa=${encodeURIComponent(wa)}&title=${encodeURIComponent(title)}`;
  whatsappLink = `https://wa.me/${wa}`;

  document.getElementById("lpLink").innerHTML = landingPage;
  document.getElementById("waLink").innerHTML = whatsappLink;

  // QR Code dengan kontras tinggi
  document.getElementById("qrcode").innerHTML = "";
  new QRCode(document.getElementById("qrcode"), {
    text: landingPage,
    width: 260,
    height: 260,
    colorDark : "#000000",
    colorLight : "#ffffff",
    correctLevel : QRCode.CorrectLevel.H
  });

  alert("✅ Referral & QR Code berhasil dibuat!");
}

function copyLP(){ navigator.clipboard.writeText(landingPage); alert("✅ Link Landing Page berhasil dicopy!"); }
function copyWA(){ navigator.clipboard.writeText(whatsappLink); alert("✅ Link WhatsApp berhasil dicopy!"); }
function previewLP(){ if(landingPage) window.open(landingPage, "_blank"); }
function testWA(){ if(whatsappLink) window.open(whatsappLink, "_blank"); }
</script>
</body>
</html>
