<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Generator Referral Istikmal Syariah</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#063d2b;
color:white;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
color:#d8c26a;
}

.card{
background:#0b513b;
padding:25px;
border-radius:25px;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
margin-bottom:5px;
}

input,select,textarea{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:40px;
margin-top:15px;
font-size:18px;
font-weight:bold;
background:#d8c26a;
color:#063d2b;
cursor:pointer;
}

.result{
background:#02291d;
padding:15px;
border-radius:15px;
word-break:break-all;
margin-top:15px;
}

#qrcode{
text-align:center;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<h1>
🕋 Generator Referral Istikmal Syariah
</h1>

<div class="card">

<label>Nama Leader</label>
<input
type="text"
id="nama"
placeholder="Agnes Marsilah"
onkeyup="buatSlug()">

<label>Nomor WhatsApp</label>
<input
type="text"
id="wa"
placeholder="628xxxx">

<label>Username / Slug</label>
<input
type="text"
id="slug"
placeholder="agnes">

<label>Title</label>
<select id="title">
<option>Mitra 3IReborn</option>
<option>Leader 3IReborn</option>
<option>Entrepreneur 3IReborn</option>
</select>

<button onclick="generateLink()">
🚀 Buat Link Referral
</button>

</div>

<div class="card">

<h2>🔗 Link Referral</h2>

<div id="hasilLink" class="result">
Belum dibuat
</div>

<button onclick="copyLink()">
📋 Copy Link Referral
</button>

<button onclick="previewLP()">
👁 Preview LP
</button>

<button onclick="testWA()">
📱 Test WhatsApp
</button>

</div>

<div class="card">

<h2>📄 Kode Leader.js</h2>

<textarea id="hasilKode" rows="8"></textarea>

<button onclick="copyCode()">
📋 Copy Kode Leader.js
</button>

</div>

<div class="card">

<h2>📱 QR Code Referral</h2>

<div id="qrcode"></div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

let referralLink = "";

function buatSlug(){

let nama =
document.getElementById("nama")
.value
.toLowerCase()
.trim();

nama =
nama.replace(/\s+/g,"-");

document.getElementById("slug").value =
nama;

}

function generateLink(){

let nama =
document.getElementById("nama").value;

let wa =
document.getElementById("wa").value;

let slug =
document.getElementById("slug").value;

let title =
document.getElementById("title").value;

if(!nama || !wa || !slug){

alert("Lengkapi data dulu");

return;

}

referralLink =
"https://3ireborn.github.io/istikmal-syariah/?leader="
+slug;

document.getElementById("hasilLink")
.innerHTML =
referralLink;

let kode =
`"${slug}": {
nama: "${nama}",
wa: "${wa}",
title: "${title}"
},`;

document.getElementById("hasilKode")
.value = kode;

document.getElementById("qrcode")
.innerHTML = "";

new QRCode(
document.getElementById("qrcode"),
referralLink
);

}

function copyLink(){

navigator.clipboard.writeText(
referralLink
);

alert("Link referral berhasil dicopy");

}

function copyCode(){

navigator.clipboard.writeText(
document.getElementById("hasilKode").value
);

alert("Kode leader.js berhasil dicopy");

}

function previewLP(){

let slug =
document.getElementById("slug").value;

if(!slug){

alert("Buat referral dulu");

return;

}

window.open(
"https://3ireborn.github.io/istikmal-syariah/?leader="+slug,
"_blank"
);

}

function testWA(){

let wa =
document.getElementById("wa").value;

if(!wa){

alert("Isi nomor WA dulu");

return;

}

window.open(
"https://wa.me/"+wa,
"_blank"
);

}

</script>

</body>
</html>
